name: Build MyRootHider Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  MODULE_ID: my_root_hider
  MODULE_VERSION: v1.2.0

jobs:
  build:
    # Gunakan ubuntu-24.04 secara eksplisit untuk menghindari notice migrasi Ubuntu 26
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          
          echo "Menerima semua lisensi Android SDK..."
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1
          
          echo "Menginstal NDK r27..."
          "$SDKMANAGER" "ndk;27.0.12077973"
          
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Download zygisk.hpp
        run: |
          mkdir -p include
          curl -sSL -o include/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          echo "zygisk.hpp berhasil didownload"

      - name: Build for arm64-v8a
        run: |
          mkdir -p build/arm64-v8a
          cd build/arm64-v8a
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build . --config Release
          cd ../..
          mkdir -p zygisk
          cp build/arm64-v8a/libmy_root_hider.so zygisk/arm64-v8a.so

      - name: Build for armeabi-v7a
        run: |
          mkdir -p build/armeabi-v7a
          cd build/armeabi-v7a
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME
