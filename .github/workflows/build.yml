name: Build QwennHide

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  MODULE_ID: qwennhide
  MODULE_VERSION: v3.1.4

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize line endings
        run: |
          find . -type f \( -name '*.sh' -o -name '*.html' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.prop' -o -name '*.txt' -o -name '*.yml' -o -name '*.yaml' \) -print0 | xargs -0 sed -i 's/\r$//'

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Fetch Zygisk API header
        run: |
          mkdir -p jni
          curl --fail --silent --show-error -L -o jni/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          grep -q "REGISTER_ZYGISK_MODULE" jni/zygisk.hpp

      - name: Clean previous artifacts
        run: rm -rf zygisk pkg build

      - name: Build arm64-v8a
        run: |
          mkdir -p build/arm64-v8a zygisk
          cd build/arm64-v8a
          cmake ../.. -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cd ../..
          cp build/arm64-v8a/libqwennhide.so zygisk/arm64-v8a.so
          ls -lh zygisk/arm64-v8a.so

      - name: Build armeabi-v7a
        run: |
          mkdir -p build/armeabi-v7a
          cd build/armeabi-v7a
          cmake ../.. -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .
          cd ../..
          cp build/armeabi-v7a/libqwennhide.so zygisk/armeabi-v7a.so
          ls -lh zygisk/armeabi-v7a.so

      - name: Package module
        run: |
          mkdir -p pkg/META-INF/com/google/android

          cp module.prop pkg/
          cp customize.sh pkg/
          cp service.sh pkg/
          cp action.sh pkg/
          cp uninstall.sh pkg/
          cp api.sh pkg/
          cp -r webroot pkg/
          cp -r zygisk pkg/

          cp META-INF/com/google/android/update-binary pkg/META-INF/com/google/android/
          cp META-INF/com/google/android/updater-script pkg/META-INF/com/google/android/

          chmod 755 pkg/customize.sh
          chmod 755 pkg/service.sh
          chmod 755 pkg/action.sh
          chmod 755 pkg/uninstall.sh
          chmod 755 pkg/api.sh
          chmod 755 pkg/META-INF/com/google/android/update-binary
          chmod 644 pkg/META-INF/com/google/android/updater-script
          chmod 755 pkg/zygisk
          chmod 755 pkg/zygisk/*.so
          chmod 755 pkg/webroot
          find pkg/webroot -type f -exec chmod 644 {} +

          cd pkg
          zip -r9 ../${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip .
          cd ..

          sha256sum ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip > checksum.txt

      - name: Verify package contents
        run: |
          echo "=== Package Contents ==="
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip

          echo ""
          echo "=== Required Files ==="
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "module.prop" || (echo "module.prop MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "customize.sh" || (echo "customize.sh MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "service.sh" || (echo "service.sh MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "action.sh" || (echo "action.sh MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "uninstall.sh" || (echo "uninstall.sh MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "api.sh" || (echo "api.sh MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "webroot/index.html" || (echo "webroot/index.html MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "zygisk/arm64-v8a.so" || (echo "arm64-v8a.so MISSING"; exit 1)
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q "zygisk/armeabi-v7a.so" || (echo "armeabi-v7a.so MISSING"; exit 1)

          echo ""
          echo "=== Forbidden Old Files ==="
          if unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -E 'post-fs-data.sh|src/|include/props.h|proc_filter|mount_utils'; then
            echo "Unexpected old/residue files found"
            exit 1
          fi

          echo ""
          echo "=== ZIP Size ==="
          ls -lh ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}
          path: |
            ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip
            checksum.txt
          retention-days: 30