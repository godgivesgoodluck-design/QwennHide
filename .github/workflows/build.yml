name: Build QwennHide

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  MODULE_ID: qwennhide
  MODULE_VERSION: v1.5.0

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install NDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          "$SDK" "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Fetch Zygisk API header
        run: |
          mkdir -p include
          curl --fail --silent --show-error -L -o include/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          grep -q "REGISTER_ZYGISK_MODULE" include/zygisk.hpp

      - name: Clean previous artifacts
        run: rm -rf zygisk pkg build

      - name: Build arm64-v8a
        run: |
          mkdir -p build/arm64-v8a zygisk
          cd build/arm64-v8a
          cmake ../.. -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DQH_DEBUG=OFF
          cmake --build .
          cd ../..
          cp build/arm64-v8a/libqwennhide.so zygisk/arm64-v8a.so

      - name: Build armeabi-v7a
        run: |
          mkdir -p build/armeabi-v7a
          cd build/armeabi-v7a
          cmake ../.. -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release -DQH_DEBUG=OFF
          cmake --build .
          cd ../..
          cp build/armeabi-v7a/libqwennhide.so zygisk/armeabi-v7a.so

      - name: Package module
        run: |
          mkdir -p pkg/META-INF/com/google/android
          cp module.prop customize.sh uninstall.sh pkg/
          cp -r zygisk pkg/
          cp META-INF/com/google/android/update-binary pkg/META-INF/com/google/android/
          cp META-INF/com/google/android/updater-script pkg/META-INF/com/google/android/
          chmod 755 pkg/customize.sh pkg/uninstall.sh
          cd pkg
          zip -r9 ../${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip .

      - name: Verify package contents
        run: |
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip
          unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -q uninstall.sh
          if unzip -l ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip | grep -E 'post-fs-data.sh|service.sh|system/|sepolicy.rule'; then
            echo "Unexpected residue-producing file in package"; exit 1
          fi
          sha256sum ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip > checksum.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}
          path: |
            ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip
            checksum.txt
          retention-days: 30
