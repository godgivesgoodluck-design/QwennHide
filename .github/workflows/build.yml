name: Build MyRootHider Module

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  MODULE_ID: my_root_hider
  MODULE_VERSION: v1.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Download zygisk.hpp
        run: |
          mkdir -p include
          curl -L -o include/zygisk.hpp \
            https://raw.githubusercontent.com/topjohnwu/Magisk/master/native/src/external/zygisk/api/zygisk.hpp
          echo "Downloaded zygisk.hpp"

      - name: Build for arm64-v8a
        run: |
          mkdir -p build/arm64-v8a
          cd build/arm64-v8a
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26
          cmake --build . --config Release
          cd ../..
          mkdir -p zygisk
          cp build/arm64-v8a/libmy_root_hider.so zygisk/arm64-v8a.so

      - name: Build for armeabi-v7a
        run: |
          mkdir -p build/armeabi-v7a
          cd build/armeabi-v7a
          cmake ../.. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-26
          cmake --build . --config Release
          cd ../..
          cp build/armeabi-v7a/libmy_root_hider.so zygisk/armeabi-v7a.so

      - name: Prepare Module
        run: |
          mkdir -p module
          cp module.prop module/
          cp -r zygisk module/
          cp -r scripts/* module/
          cp -r META-INF module/
          chmod 755 module/*.sh

      - name: Create ZIP
        run: |
          cd module
          zip -r9 ../${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip .
          cd ..
          sha256sum ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip > checksum.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}
          path: |
            ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip
            checksum.txt
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}.zip
            checksum.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
