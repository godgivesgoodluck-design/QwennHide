<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QwennHide</title>
<style>
    :root{--bg:#0f1115;--card:#171a21;--text:#e8eaed;--muted:#9aa0a6;--accent:#4da3ff;--warn:#ffb84d;--ok:#3ddc84;--danger:#ff5c5c;--border:#2a2f3a}
    *{box-sizing:border-box}
    body{margin:0;padding:16px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif}
    h1{margin:0 0 4px;font-size:22px}
    .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:14px}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
    select,input[type="text"]{width:100%;background:#0d1015;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;outline:none}
    button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 12px;font-weight:600}
    button.secondary{background:#263042}
    .toolbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

    .app{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
    .app:last-child{border-bottom:0}
    .app-left{flex:1;min-width:0}
    .pkg{font-size:13px;word-break:break-all}
    .app-right{flex-shrink:0}
    select.app-mode{width:auto;min-width:140px;padding:8px}

    .badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
    .badge{font-size:11px;border-radius:999px;padding:3px 8px;background:#232a36;color:var(--muted)}
    .badge.ok{color:var(--ok)}
    .badge.warn{color:var(--warn)}
    .badge.override{color:var(--accent)}
    .small{font-size:12px;color:var(--muted);line-height:1.4}
    .warn{color:var(--warn)}
    .error{color:var(--danger);white-space:pre-wrap;font-family:monospace;font-size:12px}
    .hidden{display:none}
</style>
</head>
<body>
<h1>QwennHide</h1>
<div class="sub">Hanya aplikasi di DenyList yang ditampilkan. Mode per-app + default global.</div>

<div class="card">
    <div class="row">
        <div><b>Default mode</b><div class="small">Untuk app yang tidak di-override.</div></div>
        <select id="defaultMode" style="max-width:180px" onchange="setDefaultMode(this.value)">
            <option value="basic">Basic</option>
            <option value="aggressive">Aggressive</option>
            <option value="persistent">Persistent</option>
        </select>
    </div>
    <div class="row">
        <div><b>Prop spoofing</b><div class="small warn">Global. Berubah setelah reboot.</div></div>
        <select id="propSpoof" style="max-width:180px" onchange="setPropSpoof(this.value)">
            <option value="0">OFF</option>
            <option value="1">ON</option>
        </select>
    </div>
</div>

<div class="card">
    <input id="search" type="text" placeholder="Cari package di DenyList..." oninput="renderApps()">
    <div class="toolbar">
        <button onclick="refresh()">Refresh</button>
        <button class="secondary" onclick="resetAllOverrides()">Reset semua override</button>
    </div>
    <div class="small" style="margin-top:8px">
        Daftar diambil dari DenyList Magisk/NeoZygisk + custom umount_list.
    </div>
</div>

<div id="status" class="card hidden"></div>
<div id="list" class="card">Loading...</div>

<script>
const API="/data/adb/modules/qwennhide/api.sh";
let data={default_mode:"basic",prop_spoof:"0",apps:[]};

function showStatus(msg,isError=false){
    const el=document.getElementById("status");
    el.className="card";
    el.innerHTML=isError?`<div class="error">${msg}</div>`:`<div class="small">${msg}</div>`;
    setTimeout(()=>{el.className="card hidden"},4000);
}

async function shell(cmd){
    const bridges=[window.ksu,window.KSU,window.kernelsu,window.KernelSU,window.webui];
    for(const b of bridges){
        if(b&&typeof b.exec==="function"){
            const r=await b.exec(cmd);
            if(typeof r==="string")return r;
            if(r&&typeof r.stdout==="string")return r.stdout;
            if(r&&typeof r.output==="string")return r.output;
            return JSON.stringify(r);
        }
        if(b&&typeof b.shell==="function"){
            const r=await b.shell(cmd);
            if(typeof r==="string")return r;
            if(r&&typeof r.stdout==="string")return r.stdout;
            if(r&&typeof r.output==="string")return r.output;
            return JSON.stringify(r);
        }
    }
    throw new Error("KSU WebUI bridge tidak ditemukan.\nJalankan manual:\nsh "+API+" list");
}

function parseJSON(t){
    const s=t.indexOf("{"),e=t.lastIndexOf("}");
    if(s===-1||e===-1)throw new Error("Response bukan JSON:\n"+t);
    return JSON.parse(t.slice(s,e+1));
}

function validPkg(p){return /^[A-Za-z0-9._]+$/.test(p)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}

async function refresh(){
    const list=document.getElementById("list");
    try{
        list.innerText="Loading...";
        const out=await shell(`sh ${API} list`);
        data=parseJSON(out);
        document.getElementById("defaultMode").value=data.default_mode||"basic";
        document.getElementById("propSpoof").value=data.prop_spoof||"0";
        renderApps();
    }catch(e){
        list.innerHTML=`<div class="error">${e.message}</div>`;
    }
}

function renderApps(){
    const q=document.getElementById("search").value.toLowerCase();
    const list=document.getElementById("list");
    list.innerHTML="";

    const apps=(data.apps||[]).filter(a=>a.pkg.toLowerCase().includes(q));

    if(!apps.length){
        list.innerText="Tidak ada aplikasi di DenyList.\nTambahkan aplikasi ke DenyList terlebih dahulu, lalu Refresh.";
        return;
    }

    for(const app of apps){
        const row=document.createElement("div");
        row.className="app";

        // ─── Kiri: package + badge ───
        const left=document.createElement("div");
        left.className="app-left";

        const pkg=document.createElement("div");
        pkg.className="pkg";
        pkg.innerText=app.pkg;
        left.appendChild(pkg);

        if(app.overridden){
            const badges=document.createElement("div");
            badges.className="badges";
            const b=document.createElement("span");
            b.className="badge override";
            b.innerText="OVERRIDE";
            badges.appendChild(b);
            left.appendChild(badges);
        }

        // ─── Kanan: mode selector ───
        const right=document.createElement("div");
        right.className="app-right";

        const sel=document.createElement("select");
        sel.className="app-mode";
        sel.onchange=()=>setAppMode(app.pkg,sel.value);

        for(const v of["default","basic","aggressive","persistent"]){
            const o=document.createElement("option");
            o.value=v;
            if(v==="default"){
                o.innerText=`Default (${data.default_mode})`;
                o.selected=!app.overridden;
            }else{
                o.innerText=cap(v);
                o.selected=app.overridden&&app.mode===v;
            }
            sel.appendChild(o);
        }
        right.appendChild(sel);

        row.appendChild(left);
        row.appendChild(right);
        list.appendChild(row);
    }
}

async function setAppMode(pkg,mode){
    try{
        if(!validPkg(pkg)){showStatus("Package tidak valid.",true);return}
        if(!["default","basic","aggressive","persistent"].includes(mode)){showStatus("Mode tidak valid.",true);return}
        await shell(`sh ${API} set ${pkg} ${mode}`);
        showStatus(`Mode ${pkg} → ${mode}`);
        await refresh();
    }catch(e){showStatus(e.message,true)}
}

async function setDefaultMode(mode){
    try{await shell(`sh ${API} default ${mode}`);showStatus(`Default mode → ${mode}`);await refresh()}
    catch(e){showStatus(e.message,true)}
}

async function setPropSpoof(v){
    try{
        const out=await shell(`sh ${API} prop ${v}`);
        const o=parseJSON(out);
        if(o.reboot_required)showStatus("Prop spoofing diubah. REBOOT diperlukan.");
        await refresh();
    }catch(e){showStatus(e.message,true)}
}

async function resetAllOverrides(){
    try{
        if(!confirm("Hapus semua override per-app?"))return;
        await shell(`sh ${API} reset-all`);
        showStatus("Semua override dihapus.");
        await refresh();
    }catch(e){showStatus(e.message,true)}
}

refresh();
</script>
</body>
</html>
